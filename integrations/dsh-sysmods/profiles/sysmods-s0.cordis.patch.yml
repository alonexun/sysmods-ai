# SysMods S0/S1 隔离基线 patch —— DSH profile: sysmods-s0（基于 headless 模板）
# 依据：主计划 V1.3 §11 S0（默认关闭日志上传和 Shell）、§8.6（日志出口/运行隔离/供应链）
#       V1.3 §11 S1（create/submit/run 三工具 + get_param_card 只读，经 mcp-client 接入）
# 层序：dsh-base + dsh-headless bundles → 本文件（profile patch）→ $DSH_HOME/cordis.patch.yml（home 层，S0 保持 []）
# 应用方式：复制本文件内容到 $DSH_HOME/profiles/sysmods-s0/cordis.patch.yml（bootstrap-s0.ps1 自动执行）
# 验证方式：dsh --profile sysmods-s0 --dump-config → 对照 integrations/dsh-sysmods/dsh/s1-dump-mcp.yml
#
# 覆盖对象与理由：
#   1) session-log-deepseek —— 官方 DeepSeek 请求附带 dsh_session_log 会话日志字段（默认 enabled: true）→ 置 false
#   2) session-telemetry-otel —— OTel 反馈遥测导出（默认 FEEDBACK_ONLY，仍外发 dsh-otel-collector.deepseeksvc.com）→ 置 DISABLED（不构造传输）
#   3) tool-bash / tool-pwsh —— Shell 执行工具（Windows 下 tool-pwsh 生效）→ S0 默认禁用；确需启用走一次性沙箱+命令白名单（S2 后评估）
#   4) tool-jobs —— 后台任务执行面（同样可执行命令）→ 一并禁用
#   5) mcp-sysmods（S1）—— SysMods 受控工具接入：stdio 本地进程，复用 sysmods-ai 领域服务（MCP 与 REST 同口径）；
#      专用 SYSMODS_DB 隔离于 dsh-homes 下——验证阶段只用虚构样例，不碰开发库与客户数据（V1.3 §8.6.5）

- id: session-log-deepseek
  config:
    enabled: false
- id: session-telemetry-otel
  config:
    mode: DISABLED
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- insert:
    - id: mcp-sysmods
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: sysmods
        transport: stdio
        command: python
        args: ['-m', 'services.mcp_server']
        cwd: 'C:/Users/Chengzhang XUN/Documents/DESHY/Hy/Hyapps/Sysmods/sysmods-ai'
        env:
          SYSMODS_DB: 'C:/Users/Chengzhang XUN/Documents/DESHY/Hy/Hyapps/Sysmods/dsh-homes/s0/sysmods-mcp.db'
